services:
  db:
    image: pgvector/pgvector:pg17
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      JWT_SECRET: "${JWT_SECRET}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OLLAMA_CHAT_MODEL: "${OLLAMA_CHAT_MODEL:-gemma4:e2b}"
      OLLAMA_EMBEDDING_MODEL: "${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:300m-qat-q4_0}"
      TRANSIT_API_BASE_URL: "${TRANSIT_API_BASE_URL:-https://api.transit.ls8h.com}"
      EVENT_SEARCH_JOB_TIMEOUT_MS: "${EVENT_SEARCH_JOB_TIMEOUT_MS:-120000}"
      EVENT_PAGE_TIMEOUT_MS: "${EVENT_PAGE_TIMEOUT_MS:-5000}"
      EVENT_SEARCH_CACHE_TTL_MS: "${EVENT_SEARCH_CACHE_TTL_MS:-900000}"
      EVENT_SEARCH_DEBUG_TIMINGS: "${EVENT_SEARCH_DEBUG_TIMINGS:-false}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./backend:/app/backend
      - backend_root_node_modules:/app/node_modules
      - backend_workspace_node_modules:/app/backend/node_modules

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT}:8081"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_URL: "${EXPO_PUBLIC_API_URL}"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${LOCAL_IP}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend
      - frontend_root_node_modules:/app/node_modules
      - frontend_workspace_node_modules:/app/frontend/node_modules

volumes:
  backend_root_node_modules:
  backend_workspace_node_modules:
  frontend_root_node_modules:
  frontend_workspace_node_modules:
  postgres_data:
