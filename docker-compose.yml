
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      PORT: "8080"
      SQLITE_PATH: /app/backend/data/app.db
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - ./backend:/app/backend
      - backend_root_node_modules:/app/node_modules
      - backend_workspace_node_modules:/app/backend/node_modules
      - sqlite_data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT}:8081"
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_PUBLIC_API_URL: "${EXPO_PUBLIC_API_URL}"
      REACT_NATIVE_PACKAGER_HOSTNAME: "${LOCAL_IP}"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app/frontend
      - frontend_root_node_modules:/app/node_modules
      - frontend_workspace_node_modules:/app/frontend/node_modules

volumes:
  backend_root_node_modules:
  backend_workspace_node_modules:
  frontend_root_node_modules:
  frontend_workspace_node_modules:
  sqlite_data:
